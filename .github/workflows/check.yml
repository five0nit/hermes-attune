name: Attune checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap util-linux
      - run: python -m pip install '.[test]'
      - run: python -m pytest -o addopts= -q --tb=short
      - run: python examples/project_demo.py --output "$RUNNER_TEMP/attune-demo"
